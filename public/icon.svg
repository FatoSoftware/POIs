<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <linearGradient id="compassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle Map Grid lines in background -->
  <path d="M 0 170 Q 256 120 512 180" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6" fill="none"/>
  <path d="M 0 340 Q 256 300 512 360" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6" fill="none"/>
  <path d="M 170 0 Q 200 256 160 512" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6" fill="none"/>
  <path d="M 340 0 Q 320 256 360 512" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6" fill="none"/>

  <!-- Compass / Radar ring -->
  <circle cx="256" cy="220" r="160" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4" stroke-dasharray="8 8" fill="none"/>
  <circle cx="256" cy="220" r="110" stroke="#ffffff" stroke-opacity="0.22" stroke-width="4" fill="none"/>

  <!-- Pin Shadow -->
  <ellipse cx="256" cy="420" rx="64" ry="16" fill="#042f2e" opacity="0.4"/>

  <!-- Main Map Pin -->
  <g filter="url(#shadow)">
    <path d="M 256 80 C 176 80 112 144 112 224 C 112 320 236 416 256 424 C 276 416 400 320 400 224 C 400 144 336 80 256 80 Z" fill="url(#pinGrad)"/>
  </g>

  <!-- Inside Pin: Compass Star / Landmark Icon -->
  <circle cx="256" cy="220" r="76" fill="#0f766e"/>
  
  <!-- North needle -->
  <polygon points="256,160 274,220 256,212" fill="#ef4444"/>
  <polygon points="256,160 238,220 256,212" fill="#dc2626"/>

  <!-- South needle -->
  <polygon points="256,280 274,220 256,228" fill="#e2e8f0"/>
  <polygon points="256,280 238,220 256,228" fill="#cbd5e1"/>

  <!-- East/West needle accents -->
  <polygon points="316,220 256,212 256,228" fill="#f8fafc"/>
  <polygon points="196,220 256,212 256,228" fill="#94a3b8"/>

  <!-- Pin center golden core -->
  <circle cx="256" cy="220" r="14" fill="#fbbf24"/>
  <circle cx="256" cy="220" r="6" fill="#ffffff"/>
</svg>
